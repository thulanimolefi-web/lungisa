<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lungisa — You're offline</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #1A1A1A; color: #fff;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 2rem; }
    h1 { font-size: 1.4rem; margin-bottom: .75rem; }
    p { color: rgba(255,255,255,.6); max-width: 280px; line-height: 1.6; margin-bottom: 2rem; }
    button { background: #C4622D; color: #fff; border: none; padding: .875rem 2rem;
      border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <h1>You're offline</h1>
  <p>No connection right now. Check your internet and try again — your jobs and bids will be waiting.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
